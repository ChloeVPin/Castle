name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    name: fmt + clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install clang >= 18 (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -e
          CODENAME=$(lsb_release -cs)
          wget -qO - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/${CODENAME}/ llvm-toolchain-${CODENAME}-18 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-18 clang-format-18 clang-tidy-18 cmake
          sudo ln -sf /usr/bin/clang-18 /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-18 /usr/local/bin/clang++
          sudo ln -sf /usr/bin/clang-format-18 /usr/local/bin/clang-format
          sudo ln -sf /usr/bin/clang-tidy-18 /usr/local/bin/clang-tidy
          clang --version
          clang++ --version

      - name: Verify clang on macOS
        if: matrix.os == 'macos-latest'
        run: |
          clang --version
          clang++ --version

      - name: Install LLVM (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install llvm --version=18.1.8 --yes --no-progress
          echo "$env:ProgramFiles\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          choco install cmake ninja --yes --no-progress
        shell: pwsh

      - name: Verify clang on Windows
        if: matrix.os == 'windows-latest'
        run: |
          clang --version
          clang++ --version
        shell: pwsh

      - name: cargo fmt --check
        run: cargo fmt -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

      - name: Sample round-trip (clang backend)
        run: |
          cargo install --path . --force
          castle new ci-demo
          cd ci-demo
          castle build
          castle run
          castle check
          castle test
          castle clean --force
        shell: bash

      - name: Sample round-trip (cmake backend + fmt + tidy)
        if: matrix.os != 'macos-latest'
        run: |
          castle new ci-cmake --cmake
          cd ci-cmake
          castle build --backend cmake
          castle run
          castle fmt
          castle tidy
          castle clean --force
        shell: bash

  # Type-check selected cross-platform targets without requiring their linkers.
  cross-check:
    name: cross-check (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: cargo check --all-targets
        run: cargo check --all-targets --target ${{ matrix.target }}
