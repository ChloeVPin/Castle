[package]
name = "castle"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Cargo-inspired C++ project manager. Clang, C++23, castle.toml."
license = "MIT"
repository = "https://github.com/ChloeVPin/Castle"
homepage = "https://github.com/ChloeVPin/Castle"
readme = "README.md"
keywords = ["cpp", "clang", "cli", "build-tool", "cmake"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
notify = "8.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
toml = "1.1.3"

[dev-dependencies]
tempfile = "3.27.0"
