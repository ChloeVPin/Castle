[package]
name = "castle"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Cargo-inspired C++ project manager with direct Clang builds and a CMake fallback"
license = "MIT"
repository = "https://github.com/ChloeVPin/Castle"
readme = "README.md"

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
notify = "8.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
toml = "1.1.3"

[dev-dependencies]
tempfile = "3.27.0"
